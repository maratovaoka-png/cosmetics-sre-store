global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:5001"]

  - job_name: "product-service"
    static_configs:
      - targets: ["product-service:5002"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:5003"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:5004"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:5005"]

  - job_name: "review-service"
    static_configs:
      - targets: ["review-service:5006"]