version: "3.8"

services:
  auth-service:
    image: auth-service:latest
    ports:
      - "5001:5001"
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  product-service:
    image: product-service:latest
    ports:
      - "5002:5002"
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  order-service:
    image: order-service:latest
    ports:
      - "5003:5003"
    environment:
      - FAIL_MODE=false
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  payment-service:
    image: payment-service:latest
    ports:
      - "5004:5004"
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  notification-service:
    image: notification-service:latest
    ports:
      - "5005:5005"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  review-service:
    image: review-service:latest
    ports:
      - "5006:5006"
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cosmetics_user
      POSTGRES_PASSWORD: cosmetics_password
      POSTGRES_DB: cosmetics_store
    ports:
      - "5432:5432"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  frontend:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: any