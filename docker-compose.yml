version: "3.8"

services:
    
    
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "5001:5001"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "5002:5002"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      - FAIL_MODE=false
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "5004:5004"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "5005:5005"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always

  review-service:
    build: ./services/review-service
    container_name: review-service
    ports:
      - "5006:5006"
    restart: always

  postgres:
    image: postgres:15
    container_name: cosmetics-postgres
    environment:
      POSTGRES_USER: cosmetics_user
      POSTGRES_PASSWORD: cosmetics_password
      POSTGRES_DB: cosmetics_store
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cosmetics-redis
    ports:
      - "6379:6379"
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: cosmetics-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana
    container_name: cosmetics-grafana
    ports:
      - "3000:3000"
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cosmetics-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: always

  frontend:
    build: ./frontend
    container_name: cosmetics-react-nginx-frontend
    ports:
      - "8082:80"
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - review-service
    restart: always